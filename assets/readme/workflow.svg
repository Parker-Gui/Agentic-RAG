<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="634" viewBox="0 0 1200 634" role="img" aria-labelledby="title desc">
  <title id="title">知识入库与受控 Agent 分析流程</title>
  <desc id="desc">文档与资讯经结构分块写入 PostgreSQL。任务经历规划、工具执行、生成与审查，按预算补充检索或终止；证据、检查点和预算贯穿执行，用户偏好独立保存。</desc>
  <rect width="1200" height="634" rx="12" fill="#0B1220"/>
<text x="48" y="57" fill="#42D7C4" font-size="25" font-weight="400" font-family="Consolas,Menlo,monospace" >KNOWLEDGE IN.  EVIDENCE OUT.</text><text x="1148" y="57" fill="#9AAEC3" font-size="20" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" text-anchor="end">概念流程</text><text x="48" y="118" fill="#F3F6FB" font-size="26" font-weight="600" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >01 / 知识入库</text><text x="48" y="167" fill="#F3F6FB" font-size="26" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >文档 / 网站资讯</text><text x="48" y="202" fill="#9AAEC3" font-size="20" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >HTML · MD · DOCX · PDF</text><text x="432" y="167" fill="#F3F6FB" font-size="26" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >解析与结构分块</text><text x="432" y="202" fill="#9AAEC3" font-size="20" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >标题路径 · 修订 · 来源定位</text><text x="816" y="167" fill="#F3F6FB" font-size="26" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >PostgreSQL</text><text x="816" y="202" fill="#9AAEC3" font-size="20" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >pgvector · 文档索引</text><path d="M350 159H398" stroke="#42D7C4" stroke-width="1.5" /><path d="M390 153l8 6-8 6" fill="none" stroke="#42D7C4" stroke-width="1.5"/><path d="M734 159H782" stroke="#42D7C4" stroke-width="1.5" /><path d="M774 153l8 6-8 6" fill="none" stroke="#42D7C4" stroke-width="1.5"/><path d="M48 238H1152" stroke="#29394D" stroke-width="1.5" /><text x="48" y="291" fill="#F3F6FB" font-size="26" font-weight="600" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >02 / 任务执行</text><text x="48" y="346" fill="#F3F6FB" font-size="28" font-weight="600" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >规划</text><text x="48" y="382" fill="#9AAEC3" font-size="20" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >子任务计划</text><path d="M199 337H249" stroke="#42D7C4" stroke-width="1.5" /><path d="M241 331l8 6-8 6" fill="none" stroke="#42D7C4" stroke-width="1.5"/><text x="280" y="346" fill="#42D7C4" font-size="28" font-weight="600" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >工具循环</text><text x="280" y="382" fill="#9AAEC3" font-size="20" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >检索 · 读取</text><path d="M431 337H481" stroke="#42D7C4" stroke-width="1.5" /><path d="M473 331l8 6-8 6" fill="none" stroke="#42D7C4" stroke-width="1.5"/><text x="512" y="346" fill="#F3F6FB" font-size="28" font-weight="600" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >生成</text><text x="512" y="382" fill="#9AAEC3" font-size="20" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >引用来源</text><path d="M663 337H713" stroke="#42D7C4" stroke-width="1.5" /><path d="M705 331l8 6-8 6" fill="none" stroke="#42D7C4" stroke-width="1.5"/><text x="744" y="346" fill="#F3F6FB" font-size="28" font-weight="600" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >审查</text><text x="744" y="382" fill="#9AAEC3" font-size="20" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >校验 · 补证</text><path d="M895 337H945" stroke="#42D7C4" stroke-width="1.5" /><path d="M937 331l8 6-8 6" fill="none" stroke="#42D7C4" stroke-width="1.5"/><text x="976" y="346" fill="#F3F6FB" font-size="28" font-weight="600" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >回答 / 简报</text><text x="976" y="382" fill="#9AAEC3" font-size="20" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >Markdown 导出</text><path d="M792 403v33H328v-33" fill="none" stroke="#73A7FF" stroke-width="1.5"/><text x="560" y="469" fill="#73A7FF" font-size="20" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" text-anchor="middle">补充检索 / 重新生成，受剩余预算约束</text><path d="M48 510H1152" stroke="#29394D" stroke-width="1.5" /><text x="48" y="556" fill="#9AAEC3" font-size="20" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >贯穿执行</text><text x="216" y="556" fill="#F3F6FB" font-size="22" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >Evidence 来源记录</text><text x="572" y="556" fill="#F3F6FB" font-size="22" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >检查点 / 阶段恢复</text><text x="938" y="556" fill="#F3F6FB" font-size="22" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >调用预算 / 终止</text><text x="48" y="598" fill="#9AAEC3" font-size="20" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >用户偏好独立保存，不进入研究证据。</text>
</svg>
