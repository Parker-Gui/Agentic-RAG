<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1056" viewBox="0 0 600 1056" role="img" aria-labelledby="title desc">
  <title id="title">知识入库与 Agent 分析的纵向流程</title>
  <desc id="desc">文档或资讯经解析分块后写入 PostgreSQL；Agent 规划、检索、生成、审查，按预算补证或终止，审查通过后可以导出简报。</desc>
  <rect width="600" height="1056" rx="12" fill="#0B1220"/>
<text x="40" y="55" fill="#42D7C4" font-size="25" font-weight="400" font-family="Consolas,Menlo,monospace" >KNOWLEDGE → EVIDENCE</text><text x="40" y="112" fill="#F3F6FB" font-size="32" font-weight="600" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >01 / 知识入库</text><circle cx="60" cy="171" r="18" fill="#152A39"/><text x="60" y="179" fill="#42D7C4" font-size="24" font-weight="400" font-family="Consolas,Menlo,monospace" text-anchor="middle">1</text><text x="100" y="181" fill="#F3F6FB" font-size="30" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >文档 / 网站资讯</text><text x="100" y="218" fill="#9AAEC3" font-size="24" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >HTML · MD · DOCX · 文本型 PDF</text><path d="M60 201L60 245" fill="none" stroke="#42D7C4" stroke-width="1.5" /><circle cx="60" cy="273" r="18" fill="#152A39"/><text x="60" y="281" fill="#42D7C4" font-size="24" font-weight="400" font-family="Consolas,Menlo,monospace" text-anchor="middle">2</text><text x="100" y="283" fill="#F3F6FB" font-size="30" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >解析与结构分块</text><text x="100" y="320" fill="#9AAEC3" font-size="24" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >保留标题、修订和来源定位</text><path d="M60 303L60 347" fill="none" stroke="#42D7C4" stroke-width="1.5" /><circle cx="60" cy="375" r="18" fill="#152A39"/><text x="60" y="383" fill="#42D7C4" font-size="24" font-weight="400" font-family="Consolas,Menlo,monospace" text-anchor="middle">3</text><text x="100" y="385" fill="#F3F6FB" font-size="30" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >PostgreSQL + pgvector</text><text x="100" y="422" fill="#9AAEC3" font-size="24" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >索引与知识检索</text><path d="M40 460H560" stroke="#29394D" stroke-width="1.5" /><text x="40" y="524" fill="#F3F6FB" font-size="32" font-weight="600" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >02 / 任务执行</text><text x="40" y="589" fill="#42D7C4" font-size="30" font-weight="600" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >规划 → 工具循环</text><text x="40" y="627" fill="#9AAEC3" font-size="25" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >子任务计划 · 检索与读取</text><text x="40" y="689" fill="#F3F6FB" font-size="30" font-weight="600" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >生成 → 审查</text><text x="40" y="727" fill="#9AAEC3" font-size="25" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >引用校验 · 断言核查</text><text x="40" y="789" fill="#F3F6FB" font-size="30" font-weight="600" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >回答 / Markdown 简报</text><text x="40" y="827" fill="#9AAEC3" font-size="25" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >审查通过后导出</text><path d="M40 861H560" stroke="#29394D" stroke-width="1.5" /><text x="40" y="918" fill="#73A7FF" font-size="27" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >补证与重试受剩余预算约束</text><text x="40" y="966" fill="#F3F6FB" font-size="26" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >Evidence · 检查点 · 调用预算</text><text x="40" y="1012" fill="#9AAEC3" font-size="25" font-weight="400" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" >用户偏好与研究证据分开保存。</text>
</svg>
