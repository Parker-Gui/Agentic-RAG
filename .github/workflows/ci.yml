name: CI

# The only workflow currently enabled. Everything else in this directory is
# parked on `workflow_dispatch` (manual only) until the project needs it.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same ref cancels the previous, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    # Generous: the first uncached `uv sync` pulls torch (via flagembedding).
    timeout-minutes: 30
    env:
      LLM_PROVIDER: openai
      OPENAI_API_KEY: offline-ci-not-a-real-key
      LANGFUSE_ENABLED: "false"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      MEM0_TELEMETRY: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Before upgrading uv version, make sure astral-sh/setup-uv knows its checksum.
          # See: https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            backend/pyproject.toml
            uv.lock

      # Syncs the `backend` workspace member plus its dev group (pytest, coverage).
      # The suite mocks the DB session, so no Postgres/Redis service is needed.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Prepare offline test configuration
        run: cp ../.env.example ../.env

      - name: Run tests
        run: uv run pytest
