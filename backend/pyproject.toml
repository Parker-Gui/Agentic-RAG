[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard]>=0.139.0,<1.0.0",
    "python-multipart<1.0.0,>=0.0.27",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "tenacity<10.0.0,>=8.2.3",
    "pydantic>2.0",
    "emails>=1.1.2,<2.0",
    "jinja2<4.0.0,>=3.1.4",
    "alembic<2.0.0,>=1.12.1",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary,pool]>=3.1.13,<4.0.0",
    "sqlmodel>=0.0.39,<1.0.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]>=2.63.0,<3.0.0",
    "pyjwt<3.0.0,>=2.13.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    # Cookie signing for Starlette's SessionMiddleware (SESSION_ENABLED).
    "itsdangerous<3.0.0,>=2.2.0",
    "selenium",
    "undetected-chromedriver",
    "pyvirtualdisplay",
    "beautifulsoup4",
    "pymupdf",
    "openpyxl",
    "python-dotenv",
    "openai",
    "torch",
    "flagembedding>=1.4.0",
    "pgvector>=0.4.1",
    "modelscope>=1.39.1",
    "langgraph>=1.2.11",
    "langchain>=1.3.17",
    "langchain-ollama>=0.3.10",
    "langchain-openai>=0.3.35",
    "langchain-aws>=1.7.4",
    "tavily>=1.1.0",
    "tavily-python>=0.8.0",
    "deepagents==0.7.32",
    "mem0ai==2.2.1",
    "langfuse==5.2.0",
    "langgraph-checkpoint-postgres==3.2.1",
    "python-docx>=1.2,<2",
    "markdown-it-py>=4,<5",
    "langchain-text-splitters==1.1.2",
]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "mypy<3.0.0,>=1.8.0",
    "ty>=0.0.25",
    "ruff<1.0.0,>=0.2.2",
    "coverage<8.0.0,>=7.4.3",
    "langgraph-cli[inmem]>=0.4.31",
    "langgraph-checkpoint-sqlite==3.1.3",
    "pyarrow==25.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: summarize non-passing outcomes; strict flags turn typo'd markers and bad
# config into errors instead of silently-skipped tests.
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

# asyncpg is only used by app/db/todo_pool.py and is not installed yet.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
exclude = ["alembic"]
# The codebase is written at 120 (see CLAUDE.md). Without this, the formatter
# falls back to its 88-char default and rewraps every file it touches.
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.per-file-ignores]
# 评测 CLI 入口：打印结果表格是其本职（不是调试残留），豁免 T201。
"eval/run_eval.py" = ["T201"]
# 测试的 fake 回调常为匹配被测签名保留未用参数（stub 本质，非坏味道），豁免 ARG001。
"tests/**" = ["ARG001"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.ty.terminal]
error-on-warning = true

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
